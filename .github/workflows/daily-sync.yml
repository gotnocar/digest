name: Synchronize digest feeds
on:
  schedule:
    - cron: '15 7,13,19 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digest-feed
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - run: npm run build
      - name: Commit validated digest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m 'Update digest feeds'
          git push origin HEAD:main
  deploy:
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
